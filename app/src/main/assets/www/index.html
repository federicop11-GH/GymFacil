<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f13">
<title>GymFácil — Rutinas de gimnasio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f13;--s1:#15181e;--s2:#1c2028;--s3:#262b35;--line:#2a303b;
  --tx:#f3f4f6;--mu:#9aa1ad;--mu2:#6b7280;
  --ac:#c8f53b;--ac-ink:#141a05;--ac-soft:rgba(200,245,59,.12);
  --ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--h:#5bb8ff;--m:#ff7aa8;
  --r:16px;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
input{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 16px 10px;background:rgba(13,15,19,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);min-height:56px}
.topbar h1{font:700 22px/1 var(--disp);letter-spacing:.3px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{color:var(--ac)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--s2);flex:none}
.icon-btn svg{width:22px;height:22px}
.g-chip{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--s2);font-weight:600;font-size:13px;flex:none}
.g-dot{width:8px;height:8px;border-radius:50%}
main{flex:1;padding:16px 16px calc(100px + var(--safe-b))}
main.with-cta{padding-bottom:calc(170px + var(--safe-b))}
main.no-tabs{padding-bottom:calc(32px + var(--safe-b))}
/* tab bar */
.tabbar{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:flex;background:rgba(21,24,30,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--safe-b))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:12px;color:var(--mu);font-size:12px;font-weight:600}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--ac)}
.tabbar.hide{display:none}
/* generic */
.h-sec{font:700 13px/1 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:22px 2px 10px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.muted{color:var(--mu)}
.small{font-size:13px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--s3);color:var(--tx)}
.lv-1{background:rgba(74,222,128,.14);color:var(--ok)}
.lv-2{background:rgba(251,191,36,.14);color:var(--warn)}
.lv-3{background:rgba(248,113,113,.14);color:var(--bad)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:14px;font-weight:700;font-size:16px;background:var(--s3)}
.btn svg{width:20px;height:20px}
.btn-ac{background:var(--ac);color:var(--ac-ink)}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.btn-sm{padding:10px 14px;font-size:14px;width:auto;border-radius:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.chev{width:20px;height:20px;color:var(--mu2);flex:none}
/* onboarding */
.onb{padding:28px 4px}
.onb .logo{font:800 44px/1 var(--disp);letter-spacing:.5px}
.onb .logo span{color:var(--ac)}
.onb p.lead{color:var(--mu);font-size:16px;margin:10px 0 28px}
.g-card{display:flex;align-items:center;gap:16px;padding:22px 18px;border-radius:20px;background:var(--s1);border:1px solid var(--line);margin-bottom:12px;width:100%;text-align:left}
.g-card .g-ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none;font:800 28px/1 var(--disp)}
.g-card b{display:block;font:700 24px/1.1 var(--disp)}
.g-card:active{transform:scale(.99)}
/* routine cards */
.r-card{display:block;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px;width:100%;text-align:left;position:relative;overflow:hidden}
.r-card::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:var(--ac-soft)}
.r-card h3{font:700 26px/1.05 var(--disp);margin:10px 0 6px;position:relative;z-index:1}
.r-meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--mu);font-size:13px;margin-top:10px}
.r-meta span{display:inline-flex;align-items:center;gap:5px}
.r-meta svg{width:15px;height:15px}
.info{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:6px}
.info summary{list-style:none;padding:14px 16px;font-weight:600;display:flex;align-items:center;gap:10px;cursor:pointer}
.info summary::-webkit-details-marker{display:none}
.info summary svg{width:20px;height:20px;color:var(--ac)}
.info .body{padding:0 16px 14px;color:var(--mu);font-size:14px}
.info ol{margin:0;padding-left:20px}
.info li{margin:6px 0}
/* routine detail */
.hero h2{font:800 32px/1.02 var(--disp);margin:8px 0}
.hero p{color:var(--mu);margin:6px 0 0}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 0}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.stat b{display:block;font:700 24px/1 var(--disp)}
.stat span{font-size:12px;color:var(--mu)}
.tip{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--ac-soft);color:#e7f9b3;font-size:13.5px;margin-top:14px}
.tip svg{width:20px;height:20px;flex:none;color:var(--ac)}
.days{display:flex;gap:8px;overflow-x:auto;margin:18px -16px 0;padding:2px 16px 4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;padding:10px 14px;border-radius:12px;background:var(--s2);border:1px solid var(--line);text-align:left;min-width:110px}
.day b{display:block;font:700 18px/1 var(--disp)}
.day small{color:var(--mu);font-size:12px}
.day.on{background:var(--ac);color:var(--ac-ink);border-color:var(--ac)}
.day.on small{color:#3b4a12}
.ex-row{display:flex;align-items:center;gap:12px;padding:14px;background:var(--s1);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;width:100%;text-align:left}
.ex-num{width:34px;height:34px;border-radius:10px;background:var(--s3);display:grid;place-items:center;font:700 17px/1 var(--disp);flex:none}
.ex-row b{display:block;font-weight:600;font-size:15px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;background:var(--s3);color:#d6d9df;display:inline-flex;align-items:center;gap:4px}
.pill svg{width:12px;height:12px}
.cta-bar{position:fixed;z-index:25;left:50%;transform:translateX(-50%);width:100%;max-width:560px;bottom:calc(66px + var(--safe-b));padding:12px 16px;background:linear-gradient(to top,var(--bg) 70%,rgba(13,15,19,0))}
/* exercise detail */
.video{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--line)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-link{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:radial-gradient(120% 90% at 30% 20%,#2b3240 0%,#11141a 60%,#0b0d11 100%)}
.video-link .play{width:68px;height:68px;border-radius:50%;background:#ff0033;display:grid;place-items:center;box-shadow:0 8px 30px rgba(255,0,51,.35)}
.video-link .play svg{width:30px;height:30px;color:#fff;margin-left:4px}
.video-link b{font-weight:700;margin-top:8px}
.video-link small{color:var(--mu)}
.video-tag{position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;background:rgba(0,0,0,.55);padding:4px 8px;border-radius:8px}
.yt-link{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--mu);margin-top:8px}
.ex-title{font:800 30px/1.05 var(--disp);margin:16px 0 6px}
.presc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.presc div{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.presc b{display:block;font:700 26px/1 var(--disp);color:var(--ac)}
.presc span{font-size:12px;color:var(--mu)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border:0}
.steps li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:8px;background:var(--ac-soft);color:var(--ac);font:700 15px/26px var(--disp);text-align:center}
.errs{list-style:none;padding:0;margin:0}
.errs li{display:flex;gap:10px;padding:7px 0}
.errs li svg{width:18px;height:18px;color:var(--bad);flex:none;margin-top:1px}
/* library */
.search{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.search svg{width:20px;height:20px;color:var(--mu)}
.search input{flex:1;background:none;border:0;outline:0;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 4px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-size:13px;font-weight:600;color:#cfd3da}
.chip.on{background:var(--tx);color:#111;border-color:var(--tx)}
/* workout */
.wk-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.progress{height:6px;background:var(--s3);border-radius:99px;overflow:hidden;flex:1}
.progress i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .3s}
.wk-count{font:700 15px/1 var(--disp);color:var(--mu)}
.wk-name{font:800 30px/1.05 var(--disp);margin:14px 0 4px}
.setdots{display:flex;gap:8px;margin:16px 0 4px;flex-wrap:wrap}
.setdot{width:42px;height:42px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;font:700 17px/1 var(--disp);color:var(--mu)}
.setdot.done{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.setdot.cur{border-color:var(--ac);color:var(--tx)}
.kg{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:12px}
.kg input{width:80px;background:var(--s3);border:0;border-radius:10px;padding:10px;text-align:center;font-weight:700;font-size:17px;outline:none}
.kg .stepbtn{width:40px;height:40px;border-radius:10px;background:var(--s3);font-size:20px;font-weight:700}
.wk-nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.wk-nav .btn{padding:12px 6px;font-size:13px;flex-direction:column;gap:4px}
.next-up{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border-radius:14px;border:1px dashed var(--line);color:var(--mu);font-size:14px}
.next-up b{color:var(--tx)}
.wk-list{margin-top:8px}
.wk-li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:14px;width:100%;text-align:left}
.wk-li .ck{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.wk-li .ck.full{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.wk-li .ck svg{width:14px;height:14px}
.wk-li.cur{color:var(--ac);font-weight:700}
/* overlay timer */
.ov{position:fixed;inset:0;z-index:60;background:rgba(8,9,12,.97);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px 24px calc(24px + var(--safe-b));text-align:center}
.ov.show{display:flex}
.ov .lbl{font:700 16px/1.2 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.ov .sub{color:var(--mu);margin-top:6px;min-height:22px}
.ring{position:relative;width:260px;height:260px;margin:22px 0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font:800 86px/1 var(--disp)}
.ov.work .lbl{color:var(--ac)}
.ov-btns{display:flex;gap:10px;width:100%;max-width:380px}
.ov-btns .btn{padding:14px 8px}
/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.sheet-bg.show{display:flex}
.sheet{width:100%;max-width:560px;background:var(--s1);border-radius:22px 22px 0 0;padding:20px 16px calc(20px + var(--safe-b));border-top:1px solid var(--line)}
.sheet h3{font:700 24px/1.1 var(--disp);margin:0 0 6px}
.sheet p{color:var(--mu);margin:0 0 16px}
.sheet .btn{margin-top:8px}
/* progress */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.wd{text-align:center;font-size:12px;color:var(--mu)}
.wd i{display:block;margin:6px auto 0;width:34px;height:34px;border-radius:10px;background:var(--s2);border:1px solid var(--line)}
.wd i.on{background:var(--ac);border-color:var(--ac)}
.wd.today{color:var(--tx);font-weight:700}
.hist{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.hist .d{width:48px;text-align:center;flex:none}
.hist .d b{display:block;font:700 22px/1 var(--disp)}
.hist .d span{font-size:11px;color:var(--mu);text-transform:uppercase}
.empty{text-align:center;padding:30px 10px;color:var(--mu)}
.empty svg{width:44px;height:44px;color:var(--mu2)}
.done-hero{text-align:center;padding:30px 0 10px}
.done-hero .big{width:96px;height:96px;border-radius:30px;background:var(--ac);color:var(--ac-ink);display:grid;place-items:center;margin:0 auto 18px}
.done-hero .big svg{width:50px;height:50px}
.done-hero h2{font:800 36px/1 var(--disp);margin:0 0 8px}
.foot{font-size:12px;color:var(--mu2);text-align:center;margin-top:26px;line-height:1.5}
.fade{animation:fade .18s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar"></header>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar">
    <button data-act="tab" data-tab="rutinas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Rutinas</button>
    <button data-act="tab" data-tab="ejercicios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z" fill="currentColor"/></svg>Ejercicios</button>
    <button data-act="tab" data-tab="progreso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progreso</button>
  </nav>
</div>

<div class="ov" id="ov">
  <div class="lbl" id="ovLbl">Descanso</div>
  <div class="ring">
    <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="#262b35" stroke-width="8"/><circle id="ovArc" cx="60" cy="60" r="54" fill="none" stroke="#c8f53b" stroke-width="8" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="0"/></svg>
    <div class="num" id="ovNum">60</div>
  </div>
  <div class="sub" id="ovSub"></div>
  <div class="ov-btns" style="margin-top:22px">
    <button class="btn" data-act="ov-add" data-s="-15">−15 s</button>
    <button class="btn" data-act="ov-add" data-s="15">+15 s</button>
    <button class="btn btn-ac" data-act="ov-skip" id="ovSkip">Saltar</button>
  </div>
</div>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>

<script>
/* ============================================================
   DATOS: EJERCICIOS
   v = ID de video de YouTube (en español)
   g = grupo muscular · c = 1 si es multiarticular
   ============================================================ */
const EX = {
  press_banca:{n:"Press de banca con barra",g:"pecho",c:1,eq:"Barra y banco plano",v:"fqsTgdTPRQU",m:"Pectoral mayor, tríceps y deltoides anterior",
    p:["Acostate con los ojos debajo de la barra y los pies bien apoyados en el piso.","Agarrá la barra un poco más ancho que los hombros y juntá los omóplatos.","Bajá controlado hasta rozar la parte media-baja del pecho, codos a unos 45°.","Empujá hacia arriba exhalando, sin despegar los glúteos del banco."],
    e:["Rebotar la barra en el pecho","Abrir los codos a 90° (sobrecarga el hombro)","Levantar la cadera del banco"],t:"Cuando subas el peso, usá topes de seguridad o pedí que alguien te asista."},
  press_inclinado:{n:"Press inclinado con mancuernas",g:"pecho",c:1,eq:"Mancuernas y banco inclinado",v:"oTD5g77GgSA",m:"Pectoral superior, deltoides anterior y tríceps",
    p:["Ajustá el banco entre 30° y 45°.","Llevá las mancuernas a los costados del pecho, codos levemente cerrados.","Empujá hacia arriba y un poco hacia adentro.","Bajá en 2–3 segundos hasta sentir estiramiento en el pecho."],
    e:["Banco demasiado vertical (trabaja más hombro)","Chocar las mancuernas arriba","Bajar sin control"],t:"Subí las mancuernas apoyándolas en los muslos para llegar cómodo a la posición inicial."},
  aperturas:{n:"Aperturas con mancuernas",g:"pecho",c:0,eq:"Mancuernas y banco plano",v:"OrlXQdNwNwM",m:"Pectoral mayor",
    p:["Acostate con las mancuernas arriba del pecho, palmas enfrentadas.","Mantené los codos levemente flexionados durante todo el movimiento.","Abrí los brazos en arco hasta la altura del pecho.","Cerrá apretando el pecho, como si abrazaras un árbol."],
    e:["Estirar del todo los codos","Bajar más allá de la línea del hombro","Usar demasiado peso"],t:"Es un ejercicio de control: priorizá la sensación en el pecho antes que el peso."},
  flexiones:{n:"Flexiones de brazos",g:"pecho",c:1,eq:"Peso corporal",v:"Yb-GsrtBOcA",m:"Pectoral, tríceps, hombros y core",
    p:["Manos apoyadas un poco más ancho que los hombros.","Cuerpo recto de cabeza a talones, abdomen y glúteos firmes.","Bajá el pecho cerca del piso con los codos a unos 45°.","Empujá el piso para volver arriba."],
    e:["Hundir o levantar la cadera","Abrir los codos hacia los costados","Hacer medio recorrido"],t:"Si todavía cuesta, apoyá las manos en un banco o las rodillas en el piso."},
  fondos:{n:"Fondos en paralelas",g:"pecho",c:1,eq:"Barras paralelas",v:"OgjaUueRiII",m:"Pectoral inferior, tríceps y deltoides anterior",
    p:["Sostenete con los brazos extendidos y los hombros bajos.","Inclinate un poco hacia adelante para enfocar el pecho.","Bajá hasta que los codos queden a 90°.","Empujá hacia arriba sin bloquear de golpe los codos."],
    e:["Bajar demasiado y forzar el hombro","Encoger los hombros hacia las orejas","Balancear las piernas"],t:"Usá la máquina asistida o una banda elástica si todavía no podés con tu peso."},
  jalon:{n:"Jalón al pecho en polea",g:"espalda",c:1,eq:"Polea alta",v:"eSlKErmf5WU",m:"Dorsal ancho, bíceps y romboides",
    p:["Sentate con los muslos trabados bajo los rodillos.","Agarrá la barra un poco más ancho que los hombros.","Sacá pecho y llevá la barra a la parte alta del pecho tirando con los codos.","Subí lento hasta estirar los brazos."],

const fmtRest = s => s>=60 ? (s%60 ? `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")} min` : `${s/60} min`) : `${s} s`;
const estMin = items => { let t=0; items.forEach(([id,sets,reps,rest])=>{ t += sets*((timeOf(reps)||45)+rest) + 60; }); return Math.max(20, Math.round(t/60/5)*5); };

/* ============================================================
   ESTADO Y NAVEGACIÓN
   ============================================================ */
const state = {
  gender: store.get("gender", null),
  tab: "rutinas",
  stack: [],
  libGroup: "todos",
  libQuery: "",
  workout: null
};
const ROOTS = {rutinas:"routines", ejercicios:"library", progreso:"progress"};
const topView = () => state.stack[state.stack.length-1];

function go(view, params={}){ state.stack.push({view, params}); render(true); }
function back(){
  const cur = topView();
  if (cur && cur.view==="workout" && state.workout && !state.workout.finished){ confirmExit(); return true; }
  if (state.stack.length>1){ state.stack.pop(); if(topView().view!=="workout" && state.workout && state.workout.finished) state.workout=null; render(true); return true; }
  return false;
}
function setTab(t){ state.tab=t; state.stack=[{view:ROOTS[t],params:{}}]; render(true); }

/* Botón "atrás" de Android (lo llama la app nativa) */
window.appBack = function(){
  if ($("#sheetBg").classList.contains("show")){ closeSheet(); return true; }
  if (timer && timer.mode==="work"){ endTimer(false); return true; }
  return back();
};

/* ============================================================
   RENDER
   ============================================================ */
function render(scrollTop){
  if (!state.gender){ state.stack=[{view:"onboard",params:{}}]; }
  else if (!state.stack.length || topView().view==="onboard"){ state.stack=[{view:ROOTS[state.tab],params:{}}]; }
  const cur = topView();
  const V = VIEWS[cur.view];
  const main = $("#view");
  main.className = "fade " + (V.cls ? V.cls(cur.params) : "");
  main.innerHTML = V.html(cur.params);
  renderTop(cur, V);
  const hideTabs = cur.view==="onboard" || cur.view==="workout" || (state.workout && !state.workout.finished);
  $("#tabbar").classList.toggle("hide", hideTabs);
  if (hideTabs) main.classList.add("no-tabs");
  document.querySelectorAll(".tabbar button").forEach(b => b.classList.toggle("on", b.dataset.tab===state.tab));
  if (V.after) V.after(cur.params);
  if (scrollTop) window.scrollTo(0,0);
}

function renderTop(cur, V){
  const tb = $("#topbar");
  if (cur.view==="onboard"){ tb.style.display="none"; return; }
  tb.style.display="";
  const isRoot = state.stack.length<=1;
  const title = V.title ? V.title(cur.params) : "";
  const g = state.gender==="h" ? {t:"Hombre",c:"var(--h)"} : {t:"Mujer",c:"var(--m)"};
  let left = "";
  if (cur.view==="workout") left = `<button class="icon-btn" data-act="exit-workout" aria-label="Salir">${IC.x}</button>`;
  else if (!isRoot) left = `<button class="icon-btn" data-act="back" aria-label="Volver">${IC.back}</button>`;
  const right = (isRoot) ? `<button class="g-chip" data-act="switch-gender"><i class="g-dot" style="background:${g.c}"></i>${g.t}</button>` : "";
  tb.innerHTML = `${left}<h1>${title}</h1>${right}`;
}

function libList(){
  const q = state.libQuery.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const items = Object.entries(EX).filter(([id,e])=>{
    if (state.libGroup!=="todos" && e.g!==state.libGroup) return false;
    if (!q) return true;
    const hay = (e.n+" "+e.m+" "+GROUPS[e.g]).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
    return hay.includes(q);
  });
  if (!items.length) return `<div class="empty">No encontramos ejercicios con esa búsqueda.</div>`;
  return items.map(([id,e])=>`<button class="ex-row" data-act="open-ex" data-id="${id}">
    <div class="ex-num" style="color:#ff6b81">${IC.play.replace('<svg','<svg width="16" height="16"')}</div>
    <div class="grow"><b>${e.n}</b><div class="muted small">${GROUPS[e.g]} · ${e.eq}</div></div>${IC.chev}</button>`).join("");
}

function videoBlock(ex){
  const url = "https://www.youtube.com/watch?v="+ex.v;
  if (CAN_EMBED){
    return `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${ex.v}?rel=0&playsinline=1&hl=es&cc_lang_pref=es" title="Video: ${esc(ex.n)}" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
      <a class="yt-link" href="${url}" target="_blank" rel="noopener">¿No carga el video? Abrir en YouTube ↗</a>`;
  }
  return `<a class="video video-link" href="${url}" target="_blank" rel="noopener">
      <span class="video-tag">ESPAÑOL</span>
      <span class="play">${IC.play}</span>
      <b>Ver video de ${esc(ex.n.toLowerCase())}</b>
      <small>Se abre en YouTube</small></a>`;
}

/* ============================================================
   MODO ENTRENAMIENTO
   ============================================================ */
function curItem(){ const w=state.workout; return routine(w.rid).days[w.d].items[w.idx]; }

function startWorkout(rid, d){
  const items = routine(rid).days[d].items;
  state.workout = {rid, d, idx:0, done:items.map(()=>0), start:Date.now(), finished:false};
  keepAwake(true);
  go("workout");
}

function workoutHTML(){
  const w = state.workout; if (!w) return "";
  const r = routine(w.rid), day = r.days[w.d], items = day.items;
  const total = items.reduce((a,i)=>a+i[1],0), done = w.done.reduce((a,b)=>a+b,0);
  if (w.finished){
    return `<div class="done-hero"><div class="big">${IC.check}</div><h2>¡Entrenamiento completado!</h2>
      <p class="muted">${esc(r.name)} · ${esc(day.name)}</p></div>
      <div class="stats3"><div class="stat"><b>${w.min}</b><span>minutos</span></div><div class="stat"><b>${done}</b><span>series</span></div><div class="stat"><b>${items.length}</b><span>ejercicios</span></div></div>
      <div class="tip">${IC.fire}<div>Hidratate y estirá suave 5 minutos. Descansá ese grupo muscular al menos 48 h.</div></div>
      <button class="btn btn-ac" style="margin-top:18px" data-act="finish-ok">Listo</button>`;
  }
  const it = items[w.idx], ex = EX[it[0]], sets = it[1], dn = w.done[w.idx];
  const t = timeOf(it[2]);
  let nextIdx = items.findIndex((x,i)=>i>w.idx && w.done[i]<x[1]);
  if (nextIdx<0) nextIdx = items.findIndex((x,i)=>i!==w.idx && w.done[i]<x[1]);
  const last = store.get("w_"+it[0], "");
  const allDone = dn>=sets;
  let main;
  if (allDone) main = `<button class="btn btn-ac" data-act="${nextIdx>=0?"goto":"finish"}" data-i="${nextIdx}">${nextIdx>=0?"Siguiente ejercicio "+IC.next:"Terminar entrenamiento"}</button>`;
  else if (t) main = `<button class="btn btn-ac" data-act="timed">${IC.play}Iniciar ${t} s · Serie ${dn+1}</button>`;
  else main = `<button class="btn btn-ac" data-act="set-done">${IC.check}Serie ${dn+1} completada</button>`;
  return `
    <div class="wk-top"><div class="progress"><i style="width:${total?done/total*100:0}%"></i></div><span class="wk-count">${done}/${total}</span></div>
    ${w.showVideo ? videoBlock(ex) : `<button class="btn btn-ghost" data-act="toggle-video" style="padding:12px">${IC.play.replace('<svg','<svg style="color:#ff3355"')}Ver video del ejercicio</button>`}
    <div class="wk-name">${ex.n}</div>
    <div class="pills"><span class="pill">${IC.rep}${sets} × ${it[2]}</span><span class="pill">${IC.rest}Descanso ${fmtRest(it[3])}</span><span class="pill">Ejercicio ${w.idx+1} de ${items.length}</span></div>
    <div class="setdots">${Array.from({length:sets},(_,i)=>`<div class="setdot ${i<dn?"done":i===dn?"cur":""}">${i<dn?IC.check.replace('<svg','<svg width="20" height="20"'):i+1}</div>`).join("")}</div>
    ${t?"":`<div class="kg"><span class="grow small"><b>Peso usado</b><br><span class="muted">Se guarda para la próxima vez</span></span>
      <button class="stepbtn" data-act="kg" data-s="-2.5">−</button><input id="kgIn" inputmode="decimal" value="${last}" placeholder="kg"><button class="stepbtn" data-act="kg" data-s="2.5">+</button></div>`}
    <div style="margin-top:14px">${main}</div>
    <div class="wk-nav">
      <button class="btn btn-ghost" data-act="goto" data-i="${w.idx-1}" ${w.idx===0?"disabled style='opacity:.35'":""}>${IC.prev}Anterior</button>
      <button class="btn btn-ghost" data-act="open-ex" data-id="${it[0]}" data-r="${w.rid}" data-d="${w.d}" data-k="${w.idx}">${IC.info}Técnica</button>
      <button class="btn btn-ghost" data-act="goto" data-i="${w.idx+1}" ${w.idx>=items.length-1?"disabled style='opacity:.35'":""}>${IC.next}Saltar</button>
    </div>
    ${nextIdx>=0?`<div class="next-up">Próximo: <b>${EX[items[nextIdx][0]].n}</b></div>`:""}
    <div class="h-sec">Ejercicios de hoy</div>
    <div class="wk-list">${items.map((x,i)=>`<button class="wk-li ${i===w.idx?"cur":""}" data-act="goto" data-i="${i}">
      <span class="ck ${w.done[i]>=x[1]?"full":""}">${w.done[i]>=x[1]?IC.check:""}</span>
      <span class="grow">${EX[x[0]].n}</span><span class="muted small">${w.done[i]}/${x[1]}</span></button>`).join("")}</div>
    <button class="btn btn-ghost" style="margin-top:16px" data-act="finish">Terminar entrenamiento</button>`;
}

function setDone(){
  const w = state.workout; const items = routine(w.rid).days[w.d].items; const it = items[w.idx];
  w.done[w.idx]++;
  const dn = w.done[w.idx];
  const nextIdx = items.findIndex((x,i)=>w.done[i]<x[1] && i!==w.idx) ;
  if (dn>=it[1]){
    if (nextIdx<0){ finishWorkout(); return; }
    const ni = items.findIndex((x,i)=>i>w.idx && w.done[i]<x[1]);
    const target = ni>=0 ? ni : nextIdx;
    w.idx = target; w.showVideo = false;
    render(true);
    startTimer("rest", it[3], `Siguiente: ${EX[items[target][0]].n}`);
  } else {
    render(false);
    startTimer("rest", it[3], `Próxima: serie ${dn+1} de ${it[1]}`);
  }
}

function finishWorkout(){
  const w = state.workout; if (!w || w.finished) return;
  const r = routine(w.rid), day = r.days[w.d];
  const sets = w.done.reduce((a,b)=>a+b,0);
  w.min = Math.max(1, Math.round((Date.now()-w.start)/60000));
  w.finished = true;
  if (sets>0){
    const h = store.get("history", []);
    h.push({date:new Date().toISOString(), routine:r.name, day:`${day.name} · ${day.focus}`, min:w.min, sets});
    store.set("history", h.slice(-300));
  }
  keepAwake(false);
  vibrate([120,80,120,80,240]); beep(988,.25);
  const i = state.stack.findIndex(s=>s.view==="workout");
  if (i>=0) state.stack = state.stack.slice(0,i+1);
  render(true);
}

function leaveWorkout(){
  const i = state.stack.findIndex(s=>s.view==="workout");
  if (i>=0) state.stack = state.stack.slice(0,i);
  if (!state.stack.length) state.stack=[{view:ROOTS[state.tab],params:{}}];
  state.workout = null; keepAwake(false); render(true);
}

function confirmExit(){
  openSheet(`<h3>¿Salir del entrenamiento?</h3><p>Podés terminarlo ahora y guardar lo que hiciste, o seguir entrenando.</p>
    <button class="btn btn-ac" data-act="sheet-close">Seguir entrenando</button>
    <button class="btn" data-act="finish">Terminar y guardar</button>
    <button class="btn btn-ghost" data-act="discard">Salir sin guardar</button>`);
}

/* ---------- Temporizador (descanso / serie por tiempo) ---------- */
let timer = null;
const ARC = 339.3;
function startTimer(mode, sec, sub){
  if (timer) clearInterval(timer.iv);
  timer = {mode, end:Date.now()+sec*1000, total:sec, last:-1};
  const ov = $("#ov");
  ov.classList.toggle("work", mode==="work");
  $("#ovLbl").textContent = mode==="work" ? "¡Aguantá!" : "Descanso";
  $("#ovSub").textContent = sub||"";
  $("#ovSkip").textContent = mode==="work" ? "Terminar" : "Saltar";
  $("#ovArc").setAttribute("stroke", mode==="work" ? "#ffffff" : "#c8f53b");
  ov.classList.add("show");
  tick(); timer.iv = setInterval(tick, 200);
}
function tick(){
  if (!timer) return;
  const ms = Math.max(0, timer.end-Date.now());
  const left = Math.ceil(ms/1000);
  $("#ovNum").textContent = left;
  $("#ovArc").setAttribute("stroke-dashoffset", String(ARC*(1-ms/(timer.total*1000))));
  if (left<=3 && left>0 && left!==timer.last){ timer.last=left; beep(660,.08); }
  if (ms<=0) endTimer(true);
}
function endTimer(natural){
  if (!timer) return;
  clearInterval(timer.iv);
  const mode = timer.mode; timer = null;
  $("#ov").classList.remove("show");
  if (natural){ beep(988,.3); vibrate(mode==="work"?[300]:[200,100,200]); }
  if (mode==="work" && natural) setDone();
}

/* ---------- Sonido, vibración y pantalla ---------- */
let actx = null;
function unlockAudio(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if (actx.state==="suspended") actx.resume(); }catch(e){} }
function beep(f=880, d=.15){
  try{ if(!actx) return; const o=actx.createOscillator(), g=actx.createGain(); o.type="sine"; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
    const t=actx.currentTime; g.gain.setValueAtTime(.25,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.start(t); o.stop(t+d+.02); }catch(e){}
}
function vibrate(p){ try{ if (window.AndroidApp && AndroidApp.vibrate){ AndroidApp.vibrate(Array.isArray(p)?p.reduce((a,b)=>a+b,0):p); } else if (navigator.vibrate) navigator.vibrate(p); }catch(e){} }
let wakeLock = null;
async function keepAwake(on){
  try{ if (window.AndroidApp && AndroidApp.keepScreenOn){ AndroidApp.keepScreenOn(!!on); return; } }catch(e){}
  try{ if (on && navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen"); else if (!on && wakeLock){ await wakeLock.release(); wakeLock=null; } }catch(e){}
}

/* ---------- Hoja inferior ---------- */
function openSheet(html){ $("#sheet").innerHTML = html; $("#sheetBg").classList.add("show"); }
function closeSheet(){ $("#sheetBg").classList.remove("show"); }
$("#sheetBg").addEventListener("click", e=>{ if (e.target.id==="sheetBg") closeSheet(); });

/* ============================================================
   ACCIONES
   ============================================================ */
const ACT = {
  tab:el=>{ if (state.workout && !state.workout.finished){ confirmExit(); return; } setTab(el.dataset.tab); },
  back:()=>back(),
  gender:el=>{ state.gender=el.dataset.g; store.set("gender", state.gender); closeSheet(); state.tab="rutinas"; state.stack=[{view:"routines",params:{}}]; render(true); },
  "switch-gender":()=>openSheet(`<h3>¿Para quién son las rutinas?</h3><p>Cambia las rutinas que ves en la pantalla principal.</p>
    <button class="g-card" data-act="gender" data-g="h"><div class="g-ic" style="background:rgba(91,184,255,.14);color:var(--h)">H</div><div class="grow"><b>Hombre</b></div>${state.gender==="h"?IC.check.replace('<svg','<svg width="22" height="22" style="color:var(--ac)"'):""}</button>
    <button class="g-card" data-act="gender" data-g="m"><div class="g-ic" style="background:rgba(255,122,168,.14);color:var(--m)">M</div><div class="grow"><b>Mujer</b></div>${state.gender==="m"?IC.check.replace('<svg','<svg width="22" height="22" style="color:var(--ac)"'):""}</button>`),
  "open-routine":el=>go("routine",{id:el.dataset.id, day:0}),
  day:el=>{ topView().params.day = +el.dataset.i; render(false); },
  "open-ex":el=>{ const p={id:el.dataset.id}; if (el.dataset.r){ p.r=el.dataset.r; p.d=+el.dataset.d; p.k=+el.dataset.k; } go("exercise",p); },
  group:el=>{ state.libGroup=el.dataset.g; render(false); },
  start:el=>{ unlockAudio(); startWorkout(el.dataset.r, +el.dataset.d); },
  "set-done":()=>{ unlockAudio(); vibrate(40); setDone(); },
  timed:()=>{ unlockAudio(); const it=curItem(); startTimer("work", timeOf(it[2]), `${EX[it[0]].n} · serie ${state.workout.done[state.workout.idx]+1} de ${it[1]}`); },
  goto:el=>{ const i=+el.dataset.i; const n=routine(state.workout.rid).days[state.workout.d].items.length; if (i>=0 && i<n){ state.workout.idx=i; state.workout.showVideo=false; render(true);} },
  kg:el=>{ const inp=$("#kgIn"); let v=parseFloat((inp.value||"0").replace(",", "."))||0; v=Math.max(0, Math.round((v+parseFloat(el.dataset.s))*10)/10); inp.value=v; store.set("w_"+curItem()[0], v); },
  finish:()=>{ closeSheet(); if (timer) endTimer(false); finishWorkout(); },
  "finish-ok":()=>leaveWorkout(),
  discard:()=>{ closeSheet(); if (timer) endTimer(false); leaveWorkout(); },
  "toggle-video":()=>{ state.workout.showVideo = true; render(false); },
  "exit-workout":()=>{ if (state.workout && state.workout.finished){ ACT["finish-ok"](); } else confirmExit(); },
  "ov-add":el=>{ if (!timer) return; timer.end += (+el.dataset.s)*1000; timer.total = Math.max(timer.total, Math.ceil((timer.end-Date.now())/1000)); if (timer.end<=Date.now()) endTimer(true); else tick(); },
  "ov-skip":()=>endTimer(timer && timer.mode==="work"),
  "sheet-close":()=>closeSheet(),
  "clear-history":()=>openSheet(`<h3>¿Borrar historial?</h3><p>Se eliminan todos los entrenamientos registrados. Los pesos guardados se mantienen.</p>
    <button class="btn" style="background:var(--bad);color:#200" data-act="clear-yes">Sí, borrar</button><button class="btn btn-ghost" data-act="sheet-close">Cancelar</button>`),
  "clear-yes":()=>{ store.set("history", []); closeSheet(); render(false); }
};
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const f = ACT[el.dataset.act];
  if (f){ e.preventDefault(); f(el, e); }
});
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden && timer) tick(); });

render(true);
</script>
</body>
</html>
